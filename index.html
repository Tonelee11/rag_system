<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara — Tanzlite Digital</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; height: 100vh; display: flex; flex-direction: column;
  }
  #header {
    padding: 16px 24px; border-bottom: 1px solid #2a2a2a;
    display: flex; align-items: center; justify-content: space-between;
  }
  #header .left { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: #0BE56D;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #014A60;
  }
  .name { font-weight: 600; color: #fff; font-size: 15px; }
  .status { font-size: 12px; color: #0BE56D; margin-top: 2px; }
  #reset-btn {
    background: none; border: 1px solid #333; color: #888;
    font-size: 12px; padding: 6px 12px; border-radius: 6px;
    cursor: pointer; transition: all 0.2s;
  }
  #reset-btn:hover { border-color: #555; color: #ccc; }

  #messages {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 0;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  .msg-block { padding: 14px 18px; border-left: 3px solid transparent; margin-bottom: 2px; }
  .msg-block.zara { border-left-color: #0BE56D; background: #222; }
  .msg-block.user { border-left-color: #014A60; background: transparent; }
  .msg-label { font-size: 12px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .msg-block.zara .msg-label { color: #0BE56D; }
  .msg-block.user .msg-label { color: #5a9ab5; }
  .msg-text { line-height: 1.7; color: #d0d0d0; white-space: pre-wrap; }
  .msg-block.zara .msg-text { color: #e8e8e8; }
  .thinking .msg-text { color: #555; font-style: italic; }

  #input-area {
    border-top: 1px solid #2a2a2a; padding: 16px 24px;
    display: flex; gap: 12px; align-items: center; background: #1a1a1a;
  }
  #question-input {
    flex: 1; background: transparent; border: none;
    border-bottom: 1px solid #444; color: #e0e0e0;
    font-size: 15px; padding: 8px 0; outline: none; font-family: inherit;
    transition: border-color 0.2s;
  }
  #question-input:focus { border-bottom-color: #0BE56D; }
  #question-input::placeholder { color: #555; }
  #send-btn {
    background: none; border: none; cursor: pointer;
    padding: 6px; opacity: 0.6; transition: opacity 0.2s;
  }
  #send-btn:hover { opacity: 1; }
  #send-btn:disabled { opacity: 0.2; cursor: not-allowed; }
  #send-btn svg { width: 22px; height: 22px; display: block; }
  #char-count { font-size: 11px; color: #444; min-width: 40px; text-align: right; }
</style>
</head>
<body>

<div id="header">
  <div class="left">
    <div class="avatar">Z</div>
    <div>
      <div class="name">Zara — Tanzlite Digital</div>
      <div class="status">● Online</div>
    </div>
  </div>
  <button id="reset-btn">New conversation</button>
</div>

<div id="messages"></div>

<div id="input-area">
  <input type="text" id="question-input" placeholder="Ask a question..." maxlength="500" autocomplete="off" />
  <span id="char-count">0/500</span>
  <button id="send-btn" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0BE56D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
  const API_URL = "https://ragsystem-production-f1b2.up.railway.app";
  const API_KEY = "2ae3a24990438226f8e827a6677999c41bcf53b0f2e21d8b298e10e262d7c76d";

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("question-input");
  const sendBtn    = document.getElementById("send-btn");
  const resetBtn   = document.getElementById("reset-btn");
  const charCount  = document.getElementById("char-count");

  // Conversation history stored in memory
  let history = [];

  function addMessage(label, text, type, isThinking = false) {
    const block = document.createElement("div");
    block.className = `msg-block ${type}${isThinking ? " thinking" : ""}`;
    block.innerHTML = `<div class="msg-label">${label}</div><div class="msg-text">${text}</div>`;
    messagesEl.appendChild(block);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return block;
  }

  function setLoading(state) {
    sendBtn.disabled = state;
    inputEl.disabled = state;
  }

  async function send() {
    const question = inputEl.value.trim();
    if (!question) return;

    addMessage("You", question, "user");
    inputEl.value = "";
    charCount.textContent = "0/500";
    setLoading(true);

    const thinking = addMessage("Zara", "thinking...", "zara", true);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": API_KEY,
        },
        body: JSON.stringify({ question, history }),
      });

      const data = await res.json();
      thinking.remove();

      const answer = data.answer || "Sorry, I could not get an answer.";
      addMessage("Zara", answer, "zara");

      // Add to history for next turn
      history.push({ role: "user", content: question });
      history.push({ role: "assistant", content: answer });

      // Keep last 10 turns max
      if (history.length > 20) history = history.slice(-20);

    } catch (err) {
      thinking.remove();
      addMessage("Zara", "Connection error. Make sure the API is running on localhost:3000.", "zara");
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  // Reset conversation
  resetBtn.addEventListener("click", () => {
    history = [];
    messagesEl.innerHTML = "";
    addMessage("Zara", "Sure! Let's start fresh. How can I help you?", "zara");
    inputEl.focus();
  });

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", () => {
    charCount.textContent = `${inputEl.value.length}/500`;
  });

  // Welcome message on load
  addMessage("Zara", "Hi! I'm Zara from Tanzlite Digital. How can I help you today?", "zara");
  inputEl.focus();
</script>
</body>
</html>
